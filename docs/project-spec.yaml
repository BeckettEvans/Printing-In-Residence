  - Relay order for drafting and review is Beckett, Jade, Bennett, then Beckett for the final pass.
  - Jade reviews Bennett's pages; Bennett reviews Jade's.

ai_use_rules:
  source: Research card BE-5, summarising the assignment sheet and syllabus
  writing: Generative AI may not be used to write words for the team
  allowed_with_citation:
    - translating sources
    - reading support
    - outlining
    - brainstorming
    - researching
  images: >
    AI images are allowed for headers and page decoration only and must be cited.
    Anything that teaches a step (screenshots, diagrams, photos of the printer) must be the team's own.
  uncited_use: counts as academic misconduct
  citation_format: >
    [Generative AI tool]. (YYYY/MM/DD of prompt). "Text of prompt". Generated using [Name of Tool].
    Website of tool, followed by a bracketed note on how the AI was used.
  team_controls:
    - Each person scans their own sections with GPTZero (10,000 characters per scan)
    - Screenshots of scans go in the AI Scans tab before Nov 22 and again before Dec 4
    - Each caption on an AI image says "AI generated image"
  open_point: >
    The doc does not say whether AI may be used to build the website's code and layout.
    This needs the instructor's answer or an explicit disclosure before any AI-built site is submitted.

design_standards:          # team charter, section 5
  principle: The design is not supposed to catch the eye
  typography: One typeface for body text at 11 or 12 pt; one consistent heading hierarchy; bold for emphasis; no underlining
  spacing: Consistent margins, line spacing and alignment; effective white space
  header_footer: Header carries the project title; footer carries the page number
  structure: Consistent headings and subheadings; numbered steps; parallel lists
  colour: One primary colour and one accent; readable in black and white
  visuals: Support the message, never replace text; every visual has a caption; processes shown as a series of visuals
  review: Contrast, repetition, alignment and proximity checked before the Dec 4 review
writing_rules:             # Everyone tab
  - Own words everywhere; close paraphrase or a direct quote gets an in-text citation
  - Every source goes into the Research Notebook in APA 7 when it is used
  - Paragraphs of three sentences at most
  - Every page ends with a troubleshooting or FAQ block written by the page owner
  - Every visual has a caption and alt text

