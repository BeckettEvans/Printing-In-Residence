recorded_findings:           # as stated in the doc; not re-verified by Claude
  - H Building is Lá:lem te Baker; J Building is Lá:léms Ye EverGreen
  - H Building has hardwired Rogers internet with a Wi-Fi modem in each bedroom (handbook s. 2.19)
  - J Building uses eduroam; devices that cannot use eduroam go on UFV-Gamer by MAC address (handbook s. 2.19)
  - Personal Wi-Fi routers are on the prohibited list (handbook s. 1.10.1)
  - The 2026-27 housing handbook does not mention 3D printers
  - H Building is shut down for construction, so the network test runs in J only

