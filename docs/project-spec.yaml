project:
  title: "Printing in Residence: Running a Bambu Lab H2S in UFV Student Housing"
  short_title: Printing in Residence
  course: CMNS 390, Assignments 3 and 4 (Major Project Documentation)
  institution: University of the Fraser Valley (UFV)
  term: Fall 2026
  instructor: Kelsey Blair
  deliverable: A website that is the documentation, plus a Brightspace title page linking to it
  platform: GitHub Pages, plain HTML (decided in research card BE-3)
  printer: Bambu Lab H2S (Beckett owns the test unit)
  audience: >
    UFV residents in H or J Building who own, or are about to buy, a Bambu Lab H2S.
    Comfortable with a phone and laptop; no 3D printing or networking background.
    They read the guide on their phones.
  in_scope:
    - Working out which building's rules and network apply
    - Asking Housing for permission before the printer arrives
    - Getting the printer online in H Building
    - Getting the printer online in J Building
    - Connection troubleshooting
    - Room setup and getting ready for inspection
  out_of_scope:
    - Unboxing
    - Slicing
    - First print
  out_of_scope_handling: Start Here links out to Bambu Lab's own wiki guides instead of repeating them
  disclaimer: Not an official UFV or Bambu Lab document; Housing's written answer comes first

